- name: configure dispatch server
  hosts: dispatch
  become: yes
  tasks:
    - name: Install golang
      dnf:
        name: golang
        state: present

    - name: Create roboshop system user
      user:
        name: roboshop
        create_home: false
        home: /app
        system: true
        shell: /sbin/nologin
        comment: "roboshop system user"

    - name: remove existing app directory
      file:
        path: /app
        state: absent

    - name: remove dispatch.zip
      file:
        path: /tmp/dispatch.zip
        state: absent

    - name: create app directory
      file:
        path: /app
        state: directory

    - name: Download dispatch application
      get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/dispatch-v4.zip
        dest: /tmp/dispatch.zip

    - name: unzip dispatch
      unarchive:
        src: /tmp/dispatch.zip
        dest: /app
        remote_src: yes

    - name: Build application
      shell: go build -o dispatch .
      args:
        chdir: /app

    - name: copy dispatch service
      template:
        src: dispatch.service.j2
        dest: /etc/systemd/system/dispatch.service

    - name: force systemd to reload configuration
      systemd_service:
        daemon_reload: true

    - name: start and enable dispatch
      service:
        name: dispatch
        state: started
        enabled: yes
