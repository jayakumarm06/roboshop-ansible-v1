- name: configure frontend server
  hosts: frontend
  become: yes
  tasks:
    - name: disable default nginx
      command: dnf module disable nginx -y

    - name: enable nginx 1.26
      command: dnf module enable nginx:1.26 -y

    - name: Install nginx
      dnf:
        name: nginx
        state: present

    - name: start and enable nginx
      service:
        name: nginx
        state: started
        enabled: yes

    - name: find files
      find:
        paths: /usr/share/nginx/html/
        file_type: any
      register: files_to_delete

    - name: Remove all files
      file:
        path: "{{ item }}"
        state: absent
      loop: "{{ files_to_delete }}"

