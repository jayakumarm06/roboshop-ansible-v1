- name: configure shipping server
  hosts: shipping
  become: yes
  tasks:
    - name: enable maven:3.9
      command: dnf module enable maven:3.9 -y

    - name: Install maven & java
      package:
        name:
          - maven
          - java-25-openjdk-devel
          - maven-openjdk25 # installing this so that we no need to set JAVA_HOME again
        state: present

    - name: Create roboshop system user
      user:
        name: roboshop
        create_home: false
        home: /app
        system: true
        shell: /sbin/nologin
        comment: "roboshop system user"

    - name: remove existing app directory
      file:
        path: /app
        state: absent

    - name: remove shipping.zip
      file:
        path: /tmp/shipping.zip
        state: absent

    - name: create app directory
      file:
        path: /app
        state: directory

    - name: Download shipping application
      get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-v4.zip
        dest: /tmp/shipping.zip

    - name: unzip shipping
      unarchive:
        src: /tmp/shipping.zip
        dest: /app
        remote_src: yes

    - name: mvn version without JAVA_HOME
      command: mvn --version
      args:
        chdir: /app
      register: mvn_default

    - name: Print mvn version without JAVA_HOME
      debug:
        msg: "{{ mvn_default.stdout_lines }}"

    - name: Install dependencies and build application
      shell: mvn clean package
      args:
        chdir: /app

    - name: Move Jar
      copy:
        src: /app/target/shipping.jar
        dest: /app
        remote_src: true

    - name: Install mysql client
      dnf:
        name: mysql
        state: present

      #first check the product load or not
    - name: Check cities loaded or not
      command: mysql -h {{ mysql_host }} -u root -pRoboShop@1 -N -B -e "SELECT COUNT(*) FROM cities.cities;"
      register: cities_output

    - name: Print cities_count
      debug:
        msg: "{{ cities_output }}"
      # when: cities_output.rc != 0
