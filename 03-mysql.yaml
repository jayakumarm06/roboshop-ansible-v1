- name: configure mysql server
  hosts: mysql
  become: yes
  tasks:
    - name: enable mysql 8.4
      command: dnf module enable mysql:8.4 -y

    - name: Install mysql
      package:
        name: mysql-server
        state: present

    - name: start and enable mysql
      service:
        name: mysql
        state: started
        enabled: yes
