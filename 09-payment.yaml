- name: configure payment server
  hosts: payment
  become: yes
  tasks:
    - name: Install python and pip version 3.14
      dnf:
        name:
          - python3.14
          - python3.14-pip
        state: present

    - name: Create roboshop system user
      user:
        name: roboshop
        create_home: false
        home: /app
        system: true
        shell: /sbin/nologin
        comment: "roboshop system user"

    - name: remove existing app directory
      file:
        path: /app
        state: absent

    - name: remove payment.zip
      file:
        path: /tmp/payment.zip
        state: absent

    - name: create app directory
      file:
        path: /app
        state: directory

    - name: Download payment application
      get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/payment-v4.zip
        dest: /tmp/payment.zip

    - name: unzip payment
      unarchive:
        src: /tmp/payment.zip
        dest: /app
        remote_src: yes

    - name: Create virtual environment
      command: python3.14 -m venv /app/.venv
      args:
        creates: /app/.venv

    - name: Install specified python requirements in indicated (virtualenv)
      pip:
        requirements: /app/.venv/bin/requirements.txt
        virtualenv: /app/.venv/bin/

