- name: configure rabbitmq server
  hosts: rabbitmq
  become: yes
  tasks:
    - name: copy rabbitmq repo
      copy:
        src: rabbitmq.repo
        dest: /etc/yum.repos.d/rabbitmq.repo

    - name: Install erlang
      package:
        name:
          - erlang
          - rabbitmq-server
        state: present

    - name: start and enable rabbitmq
      service:
        name: rabbitmq-server
        state: started
        enabled: yes

    # - name: creat a user for application
    #   command: rabbitmqctl add_user roboshop roboshop123
    #   register: user_output
    #   ignore_errors: true

    # # - name: print the ouput
    # #   debug:
    # #     msg: "{{ user_output }}"

    # - name: create user
    #   command: useradd roboshop
    #   when: user_output.rc != 0

    - name: Create RabbitMQ user
      community.rabbitmq.rabbitmq_user:
        user: roboshop
        password: roboshop123
        permissions:
          - vhost: /
            configure_priv: .*
            read_priv: .*
            write_priv: .*
        state: present
