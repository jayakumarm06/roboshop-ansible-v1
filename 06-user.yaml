- name: configure user server
  hosts: user
  become: yes
  tasks:
    - name: enable node-js 24
      command: dnf module enable nodejs:24 -y

    - name: Install user
      package:
        name: nodejs
        state: present

    - name: Create user
      user:
        name: roboshop

    - name: Create a directory if it doesnot exist
      file:
        path: /app
        state: directory

    - name: Download zip file using curl
      command: curl -L -o /tmp/user.zip https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/user-v4.zip
      creates: /tmp/user.zip

    - name: unzip a file to a app folder
      unarchive:
        src: /tmp/user.zip
        dest: /app
        remote_src: yes

    - name: Install user
      community.general.npm:
        path: /app
        state: present

    - name: copy user service
      copy:
        src: user.service
        dest: /etc/systemd/system/user.service

    - name: configure systemD serive for redis
      lineinfile:
        path: /etc/systemd/system/user.service
        regexp: "^#?<REDIS-SERVER-IPADDRESS>"
        line: "redis.dewsecopai.online"

    - name: configure systemD serive for mongodb
      lineinfile:
        path: /etc/systemd/system/user.service
        regexp: "^#?<MONGODB-SERVER-IPADDRESS>"
        line: "mongodb.dewsecopai.online"

    - name: force systemd to reload configuration
      systemd_service:
        daemon_reload: true

    - name: start and enable user
      service:
        name: user
        state: started
        enabled: yes
